<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><title>IKEA Beauharnois — film</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="strings.fr.js"></script><script src="core.js"></script><script src="scenes.js"></script><script src="main.js"></script>
<script>
// Prévisualisation : ?t=12.5 fige une image ; sans paramètre, lecture en temps réel.
const q = new URLSearchParams(location.search);
if (!navigator.webdriver) window.ready.then(() => {
  if (q.has('t')) renderFrame(parseFloat(q.get('t')));
  else { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
});
</script></body></html>
